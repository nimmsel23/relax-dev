# Standalone-Prod Relax: Push auf master deployt live (nur CI) — nur relax-dev.
# Kein vitalos-Meta, keine Nachbar-Repos.
#
# Auslöser: push auf master und workflow_dispatch (automerge.yml) -> baut und deployt live (nur master).
# Push auf `ci-test/**` -> reiner Build-Test, KEIN Deploy.
# Shell-Pin im Meta-Repo bleibt bewusst: Pointer-Bump via vos-release/vos-ship.

name: Live Deploy (Relax master)

'on':
  workflow_dispatch:
    inputs:
      deploy:
        description: "Live deployen? (nur auf master wirksam; false = nur bauen)"
        type: boolean
        default: true
  push:
    branches:
      - master
      - 'ci-test/**'

concurrency:
  group: live-relax-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DO_DEPLOY: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.deploy) }}
    steps:
      - name: Checkout relax-dev
        uses: actions/checkout@v4
        with:
          path: relax-dev
          # Volle Historie: der Changelog (scripts/vos-changelog) liest bei workflow_dispatch `git log <parent>..HEAD`.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relax-dev/pnpm-lock.yaml

      - name: Install (relax-dev, eigener Lockfile)
        working-directory: relax-dev
        run: |
          # overrides-Block des Lockfiles (z. B. @grpc/grpc-js) auch in die Konfiguration; pnpm 11 liest overrides nur aus pnpm-workspace.yaml.
          if grep -q '^overrides:' pnpm-lock.yaml && [ ! -f pnpm-workspace.yaml ]; then
            sed -n '/^overrides:/,/^$/p' pnpm-lock.yaml > pnpm-workspace.yaml
          fi
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Relax
        working-directory: relax-dev
        run: pnpm run build

      - name: Deploy Relax to Firebase Hosting
        if: env.DO_DEPLOY == 'true'
        working-directory: relax-dev
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx firebase-tools@latest deploy --only hosting \
            --project fitness-aos --non-interactive



