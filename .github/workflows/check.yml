# Check für Relax: Build auf jedem PR/dev-Push, ohne Deploy und ohne Firebase-Secrets.
#
# Gleicher Aufbau wie preview-dev.yml (standalone, pnpm), aber ohne Pfadfilter und ohne
# Preview (Muster aus fitness-dev/check.yml).

name: Check (Relax)

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [vitalos, master, dev]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version kommt aus "packageManager" in package.json (pnpm@11.x)
      - uses: pnpm/action-setup@v4

      # Kein "cache: pnpm": setup-node braucht dafür eine pnpm-lock.yaml, die dieses Repo nicht hat
      # (Lockfile liegt im pnpm-Workspace von vitalos).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # scripts/ci-install.sh: pnpm 11 braucht freigegebene Build-Skripte (allowBuilds), siehe dort.
      - name: Install
        run: bash scripts/ci-install.sh

      - name: Tests
        run: pnpm test

      - name: Build Relax
        run: pnpm run build
